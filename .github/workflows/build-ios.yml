name: Build iOS

on:
  # A pushed v* tag builds and puts the files on that tag's release (made as a prerelease).
  # The ios-plan branch builds too, during Phase 1 development; remove that line before merging.
  push:
    tags: ['v*']
    branches: ['ios-plan']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the files on (e.g. v2.0.1; made as a draft prerelease if it isn't there). Empty = run artifacts only.
        required: false
        default: ''
      ref:
        description: Branch to build (a test branch; releases come from main).
        required: false
        default: main

# The release the files go on: the dispatch's tag, or the pushed tag; empty = run artifacts only
# (a dispatch started from a tag with no tag input builds main, so it doesn't go on that tag's release).
env:
  TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || '' }}

# Write: the files can go straight onto a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Dispatch: main unless another branch is asked for (ref), whichever branch the run
      # was started from. Tag push: the pushed tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.event_name == 'workflow_dispatch' && 'main') || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the unsigned IPA
        working-directory: ios
        run: |
          v=$(node -p "require('./package.json').version")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          xcodegen generate
          mkdir -p dist DerivedData
          # The IPA is intentionally unsigned. Users resign it with Signulous /
          # AltStore / Sideloadly / Xcode — see ios/README.md.
          xcodebuild \
            -project DuoDesk.xcodeproj \
            -scheme DuoDesk \
            -configuration Release \
            -archivePath "DerivedData/DuoDesk.xcarchive" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$v" \
            clean archive
          rm -rf DerivedData/Payload
          mkdir -p DerivedData/Payload
          cp -R "DerivedData/DuoDesk.xcarchive/Products/Applications/DuoDesk.app" DerivedData/Payload/
          (cd DerivedData && zip -qry "../dist/DuoDesk-$v.ipa" Payload)
          ls -lh "dist/DuoDesk-$v.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: duodesk-ios
          path: ios/dist/DuoDesk-*.ipa

      # Straight onto the release, no download and re-upload.
      - name: Upload to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag push publishes the prerelease straight away: the workflows run side by side, and
          # drafts (no tag of their own yet) would be made once each. A dispatch makes a draft.
          DRAFT: ${{ github.event_name != 'push' && 'true' || '' }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" ${DRAFT:+--draft} --prerelease --target "$(git rev-parse HEAD)" --title "$TAG" --notes "" || true
          gh release upload "$TAG" ios/dist/DuoDesk-*.ipa --clobber
